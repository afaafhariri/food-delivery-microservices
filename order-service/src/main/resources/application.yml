server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quickbite_order_db?reWriteBatchedInserts=true}
    username: ${SPRING_DATASOURCE_USERNAME:quickbite}
    password: ${SPRING_DATASOURCE_PASSWORD} # no default: a known fallback password must never be used silently
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 64
        query:
          in_clause_parameter_padding: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Fail a send within 30 s; the outbox relay retries it (see the messaging module).
        # Kafka requires delivery.timeout.ms >= linger.ms + request.timeout.ms.
        delivery.timeout.ms: 30000
        request.timeout.ms: 15000
        max.block.ms: 10000
    consumer:
      auto-offset-reset: earliest
    template:
      observation-enabled: true                # trace context travels in Kafka headers
    listener:
      observation-enabled: true
  grpc:
    client:
      channels:
        restaurant:
          address: ${RESTAURANT_GRPC_ADDRESS:static://localhost:9091}
          idle-timeout: 10m
        customer:
          address: ${CUSTOMER_GRPC_ADDRESS:static://localhost:9094}
          idle-timeout: 10m

quickbite:
  grpc:
    deadline: ${GRPC_DEADLINE:2s}
    # One breaker per upstream. Opens when >= 50% of the last 20 calls failed
    # (after at least 10), rejects orders with 503 for 10 s, then lets 3 trial calls through.
    circuit-breaker:
      sliding-window-size: 20
      minimum-number-of-calls: 10
      failure-rate-threshold: 50
      wait-duration-in-open-state: 10s
      permitted-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}   # one label to filter every metric by service
    distribution:
      percentiles-histogram:
        http.server.requests: true             # p95/p99 latency in Grafana
  otlp:
    metrics:
      export:
        enabled: false                         # metrics are pulled by Prometheus, not pushed
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  # Spans are exported over OTLP only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
  # is set (Compose and the Kubernetes observability component set it), so local runs
  # without a tracing backend stay quiet.

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
