name: quickbite

# ──────────────────────────────────────────────────────────────────────────────
# Shared building blocks
# ──────────────────────────────────────────────────────────────────────────────
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Every JVM service: one Dockerfile, hardened runtime, readiness health check.
x-jvm-service: &jvm-service
  restart: unless-stopped
  read_only: true                     # immutable container; only /tmp is writable
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s              # Spring graceful shutdown + Kafka/gRPC drain
  logging: *logging
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${SERVER_PORT}/actuator/health/readiness >/dev/null || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 30s

x-jvm-build: &jvm-build
  context: .
  dockerfile: docker/jvm.Dockerfile

x-backing-services: &backing-services
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

# Spans go to Tempo over OTLP/HTTP. Unset it to turn trace export off.
x-tracing-env: &tracing-env
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces

# Keycloak: tokens are issued for the public URL (what your browser and curl use) and the
# signing keys are fetched over the internal network.
x-auth-env: &auth-env
  AUTH_PUBLIC_URL: http://localhost:8180/auth
  AUTH_INTERNAL_URL: http://keycloak:8080/auth

x-common-env: &common-env
  <<: [*tracing-env, *auth-env]
  SPRING_DATASOURCE_USERNAME: quickbite
  SPRING_DATASOURCE_PASSWORD: quickbite123
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

# Prometheus, Tempo and Grafana: read-only, unprivileged, localhost-only ports.
x-observability: &observability
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging

services:
  # ────────────────────────────────────────────────────────────────────────────
  # Infrastructure
  # ────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine           # major version kept: existing volumes stay compatible
    container_name: quickbite-postgres
    environment:
      POSTGRES_USER: quickbite
      POSTGRES_PASSWORD: quickbite123
      POSTGRES_DB: postgres
    ports:
      # Every published port is bound to 127.0.0.1: reachable from this machine
      # only, never from the rest of the network (the dev password is public).
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Same script as the Kubernetes base (single copy); runs once, on an empty volume.
      - ./k8s/base/postgres-init/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickbite -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging
    restart: unless-stopped

  # Single-node KRaft broker (no ZooKeeper container).
  kafka:
    image: apache/kafka:4.1.2
    container_name: quickbite-kafka
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      CLUSTER_ID: 7h5VZmJLSU6SipeLOZBikw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are declared by the services (messaging module)
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -XX:-UsePerfData -Djava.awt.headless=true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Port probe instead of the kafka-*.sh tools: those spawn a second JVM
      # inside the memory-limited container on every check.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9092"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging
    restart: unless-stopped

  # Creates Keycloak's database on first run, including on a Postgres volume that
  # existed before Keycloak was added (init-databases.sql only runs on an empty one).
  keycloak-db:
    image: postgres:16-alpine
    container_name: quickbite-keycloak-db
    environment:
      PGPASSWORD: quickbite123
    command:
      - sh
      - -c
      - >-
        psql -h postgres -U quickbite -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname = 'quickbite_keycloak_db'" | grep -q 1
        || psql -h postgres -U quickbite -d postgres -c "CREATE DATABASE quickbite_keycloak_db"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  # Identity provider: login pages and tokens at http://localhost:8180/auth
  # (realm "quickbite", test users with password quickbite123; admin console:
  # http://localhost:8180/auth/admin, user admin / admin). See keycloak/README.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: quickbite-keycloak
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/quickbite_keycloak_db
      KC_DB_USERNAME: quickbite
      KC_DB_PASSWORD: quickbite123
      KC_HOSTNAME: http://localhost:8180/auth   # issuer of every token, whoever asks
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin        # master realm admin; localhost only
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/dev-users/quickbite-realm.json:/opt/keycloak/data/import/quickbite-realm.json:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # The image has no curl or wget: bash's /dev/tcp asks the management port directly.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      keycloak-db:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 768M
    logging: *logging
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────────────
  # Microservices
  # ────────────────────────────────────────────────────────────────────────────
  restaurant-service:
    <<: *jvm-service
    image: quickbite/restaurant-service:latest
    build:
      <<: *jvm-build
      args: { SERVICE: restaurant-service }
    container_name: quickbite-restaurant-service
    ports:
      - "127.0.0.1:8081:8081"                     # REST; gRPC 9091 stays on the internal network
    environment:
      <<: *common-env
      SERVER_PORT: 8081
      GRPC_PORT: 9091
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quickbite_restaurant_db
    depends_on: *backing-services
    deploy:
      resources:
        limits:
          memory: 384M

  customer-service:
    <<: *jvm-service
    image: quickbite/customer-service:latest
    build:
      <<: *jvm-build
      args: { SERVICE: customer-service }
    container_name: quickbite-customer-service
    ports:
      - "127.0.0.1:8084:8084"                     # REST; gRPC 9094 stays on the internal network
    environment:
      <<: *common-env
      SERVER_PORT: 8084
      GRPC_PORT: 9094
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quickbite_customer_db
    depends_on: *backing-services
    deploy:
      resources:
        limits:
          memory: 384M

  order-service:
    <<: *jvm-service
    image: quickbite/order-service:latest
    build:
      <<: *jvm-build
      args: { SERVICE: order-service }
    container_name: quickbite-order-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      <<: *common-env
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quickbite_order_db?reWriteBatchedInserts=true
      RESTAURANT_GRPC_ADDRESS: static://restaurant-service:9091
      CUSTOMER_GRPC_ADDRESS: static://customer-service:9094
      GRPC_DEADLINE: 2s
    depends_on:
      <<: *backing-services
      restaurant-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  delivery-service:
    <<: *jvm-service
    image: quickbite/delivery-service:latest
    build:
      <<: *jvm-build
      args: { SERVICE: delivery-service }
    container_name: quickbite-delivery-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      <<: *common-env
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quickbite_delivery_db?reWriteBatchedInserts=true
    depends_on: *backing-services
    deploy:
      resources:
        limits:
          memory: 352M

  api-gateway:
    <<: *jvm-service
    image: quickbite/api-gateway:latest
    build:
      <<: *jvm-build
      args: { SERVICE: api-gateway }
    container_name: quickbite-api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: [*tracing-env, *auth-env]
      SERVER_PORT: 8080
      RESTAURANT_SERVICE_URL: http://restaurant-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      DELIVERY_SERVICE_URL: http://delivery-service:8083
      CUSTOMER_SERVICE_URL: http://customer-service:8084
    depends_on:
      restaurant-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ────────────────────────────────────────────────────────────────────────────
  # Observability: Prometheus (metrics), Tempo (traces), Grafana (dashboards)
  #   Grafana     http://localhost:3000  (QuickBite overview dashboard, no login)
  #   Prometheus  http://localhost:9090
  # ────────────────────────────────────────────────────────────────────────────
  prometheus:
    <<: *observability
    image: prom/prometheus:v3.5.0
    container_name: quickbite-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-remote-write-receiver     # Tempo writes service-graph metrics here
      - --enable-feature=exemplar-storage      # latency points link to their traces
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 256M

  tempo:
    <<: *observability
    image: grafana/tempo:2.8.2
    container_name: quickbite-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    deploy:
      resources:
        limits:
          memory: 384M

  grafana:
    <<: *observability
    image: grafana/grafana:12.1.1
    container_name: quickbite-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Anonymous admin, no login form: acceptable only because the port is bound to localhost.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/quickbite-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs:                                     # stateless: everything is provisioned from files
      - /var/lib/grafana:size=128m,uid=472,gid=472
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  tempo-data:
