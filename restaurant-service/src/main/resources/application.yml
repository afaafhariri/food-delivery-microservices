server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: restaurant-service
  threads:
    virtual:
      enabled: true
  grpc:
    server:
      port: ${GRPC_PORT:9091}
      shutdown-grace-period: 10s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quickbite_restaurant_db}
    username: ${SPRING_DATASOURCE_USERNAME:quickbite}
    password: ${SPRING_DATASOURCE_PASSWORD} # no default: a known fallback password must never be used silently
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 64

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      modify-topic-configs: true               # existing topics get the declared retention (messaging module)
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Fail a send within 30 s; the outbox relay retries it (see the messaging module).
        # Kafka requires delivery.timeout.ms >= linger.ms + request.timeout.ms.
        delivery.timeout.ms: 30000
        request.timeout.ms: 15000
        max.block.ms: 10000
    consumer:
      auto-offset-reset: earliest
    template:
      observation-enabled: true                # trace context travels in Kafka headers
    listener:
      observation-enabled: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}   # one label to filter every metric by service
    distribution:
      percentiles-histogram:
        http.server.requests: true             # p95/p99 latency in Grafana
  otlp:
    metrics:
      export:
        enabled: false                         # metrics are pulled by Prometheus, not pushed
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  # Spans are exported over OTLP only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
  # is set (Compose and the Kubernetes observability component set it), so local runs
  # without a tracing backend stay quiet.

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

---
# Authentication: every /api request needs a Keycloak access token (see the security module).
# Keys come from the realm's JWKS endpoint, reached inside the network (AUTH_INTERNAL_URL); the
# token's issuer must be the public Keycloak URL that clients got it from (AUTH_PUBLIC_URL).
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_PUBLIC_URL:http://localhost:8180/auth}/realms/quickbite
          jwk-set-uri: ${AUTH_INTERNAL_URL:http://localhost:8180/auth}/realms/quickbite/protocol/openid-connect/certs
quickbite:
  security:
    # Browsing restaurants and menus needs no login. A restaurant's orders do: they are not listed here.
    public-get-paths: /api/restaurants, /api/restaurants/*, /api/restaurants/*/menu-items/**
