# Prometheus for Kubernetes: discovers QuickBite pods in its own namespace and
# scrapes each replica's /actuator/prometheus on its "http" container port.
# Only pods labelled app.kubernetes.io/component=backend|gateway are scraped.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: quickbite
    metrics_path: /actuator/prometheus
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: backend|gateway
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: service

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
