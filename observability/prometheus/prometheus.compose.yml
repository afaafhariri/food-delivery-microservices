# Prometheus for Docker Compose: scrapes every service's /actuator/prometheus.
# Kubernetes uses prometheus.k8s.yml instead (pod discovery, one target per replica).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: quickbite
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - restaurant-service:8081
          - order-service:8082
          - delivery-service:8083
          - customer-service:8084

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
