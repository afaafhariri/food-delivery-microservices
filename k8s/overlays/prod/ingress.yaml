# Public HTTPS entry point -> api-gateway.
# 1. Replace quickbite.example.com with your domain (an A record to the node /
#    load balancer IP).
# 2. ingressClassName: "traefik" is the k3s default. Change it to match your
#    cluster's ingress controller (`kubectl get ingressclass`).
# 3. Keycloak's login and token endpoints are public under /auth/realms (plus /auth/resources for
#    the login pages' assets). Its admin console is not: use
#    kubectl -n quickbite port-forward svc/keycloak 8180:8080, then http://localhost:8180/auth/admin
# 4. TLS certificates come from cert-manager with a ClusterIssuer named
#    "letsencrypt" (see the Kubernetes section of README.md). Without it, the
#    controller serves its self-signed default certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - quickbite.example.com
      secretName: api-gateway-tls
  rules:
    - host: quickbite.example.com
      http:
        paths:
          # Only the API is public. /actuator (health, gateway routes, Prometheus
          # metrics) stays inside the cluster.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /auth/realms
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
          - path: /auth/resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
