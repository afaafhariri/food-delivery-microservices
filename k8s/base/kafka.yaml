# Single-node Kafka 4.1 in KRaft mode (broker + controller in one pod), as in
# Compose. For a multi-broker cluster use the Strimzi operator or a managed
# Kafka (Confluent Cloud, MSK, Aiven) and change SPRING_KAFKA_BOOTSTRAP_SERVERS.
#
# Headless Service: "kafka" and "kafka-0.kafka" resolve straight to the pod IP,
# so the broker's advertised address is stable and no traffic hairpins through
# a ClusterIP back into the same pod.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true # the broker must resolve its own name while starting
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: client
      port: 9092
      targetPort: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: broker
    spec:
      automountServiceAccountToken: false
      # Required: with service links on, Kubernetes injects KAFKA_PORT,
      # KAFKA_SERVICE_HOST, ... and the image turns every KAFKA_* variable
      # into a broker setting.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "appuser" in the apache/kafka image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: apache/kafka:4.1.2
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - { name: CLUSTER_ID, value: 7h5VZmJLSU6SipeLOZBikw }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-0.kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            # A subdirectory: some volume types add "lost+found" at the mount
            # root, which Kafka would refuse as a log directory.
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx256m" }
            - name: KAFKA_JVM_PERFORMANCE_OPTS
              value: "-XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -XX:-UsePerfData -Djava.awt.headless=true"
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 512Mi }
          # Port probes, not the kafka-*.sh tools: those start a second JVM
          # inside the memory-limited container on every check.
          startupProbe:
            tcpSocket: { port: client }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            tcpSocket: { port: client }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: client }
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
