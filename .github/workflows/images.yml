# Builds every service image from docker/jvm.Dockerfile and pushes it to
# GitHub Container Registry as ghcr.io/<owner>/quickbite-<service>, tagged
# sha-<commit> and (on master) latest. k8s/overlays/prod deploys these.
name: images

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "k8s/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - restaurant-service
          - order-service
          - delivery-service
          - customer-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quickbite-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # amd64 only. For ARM nodes (e.g. Oracle Ampere), add linux/arm64 here
      # plus docker/setup-qemu-action, or build on an ubuntu-24.04-arm runner.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/jvm.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
