# Continuous integration for pull requests: nothing should reach master without passing.
#
#   checks  unit and integration tests (mvn verify; Testcontainers uses the runner's Docker),
#           Docker Compose and Kustomize manifests render, shell scripts parse
#   smoke   the whole stack in Docker Compose (Keycloak, Kafka, Postgres, the five services)
#           and scripts/smoke-test.sh against it: login, ordering, gRPC, Kafka, 401/403 rules
#
# To make these required before merging: GitHub -> Settings -> Branches -> branch protection
# rule for master -> "Require status checks to pass" -> select "checks" and "smoke".
name: ci

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true      # a new push to the PR cancels the run for the previous one

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven            # ~/.m2 kept between runs

      - name: Tests (unit + Testcontainers)
        run: mvn -B -ntp verify

      - name: Docker Compose file is valid
        run: docker compose config --quiet

      - name: Kubernetes manifests render
        run: |
          kubectl kustomize k8s/overlays/local > /dev/null
          cp k8s/overlays/prod/secrets.env.example k8s/overlays/prod/secrets.env
          kubectl kustomize k8s/overlays/prod > /dev/null

      - name: Shell scripts parse
        run: for f in scripts/*.sh k8s/vm/*.sh; do bash -n "$f"; done

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # The JDK AOT cache only speeds up startup; skipping it makes the CI images build faster.
      - name: Build images
        run: docker compose build --build-arg AOT_CACHE=false

      - name: Start the stack
        run: docker compose up -d

      # The gateway is healthy only once all four services and Keycloak are, so it is the signal.
      - name: Wait until the gateway is healthy
        run: |
          for i in $(seq 1 90); do
            status=$(docker inspect -f '{{.State.Health.Status}}' quickbite-api-gateway 2>/dev/null || echo starting)
            [ "$status" = healthy ] && { echo "ready after $((i * 5)) s"; exit 0; }
            sleep 5
          done
          echo "the stack did not become healthy in 7.5 minutes"; docker compose ps; exit 1

      - name: Smoke test
        run: scripts/smoke-test.sh

      - name: Container status and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150

      - name: Stop the stack
        if: always()
        run: docker compose down -v
